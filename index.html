<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<title>Portugal &amp; Espanha 2026</title>
<meta name="robots" content="noindex,nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PT·ES 2026">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<!-- Fontes do Google são opcionais: offline cai no fallback de sistema. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (handoff Claude Design, README) ===== */
:root{
  --paper:#f3f1ec; --ink:#111111; --muted:#5a5752; --rule:#c9c5bc; --desk:#d9d6cf;
  --land:#e6e3dc; --land2:#ece9e2;
  --c-lis:#1f4fa3; --c-sev:#c0541b; --c-mal:#0f7c7c; --c-gra:#a31f2e; --c-val:#d26d12; --c-bar:#5b3fa0; --c-ali:#44732a; --c-fln:#1f4fa3;
  --city:var(--ink);
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --text:Archivo,-apple-system,system-ui,Helvetica,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --paper:#141311; --ink:#ece8df; --muted:#a49e93; --rule:#3a3733; --desk:#d9d6cf;
  --land:#1e1c19; --land2:#262421;
  --c-lis:#4a78cc; --c-sev:#d8733a; --c-mal:#2a9b9b; --c-gra:#c43a4a; --c-val:#f0963f; --c-bar:#8362c8; --c-ali:#7fae4f; --c-fln:#4a78cc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141311; --ink:#ece8df; --muted:#a49e93; --rule:#3a3733; --desk:#d9d6cf;
    --land:#1e1c19; --land2:#262421;
    --c-lis:#4a78cc; --c-sev:#d8733a; --c-mal:#2a9b9b; --c-gra:#c43a4a; --c-val:#f0963f; --c-bar:#8362c8; --c-ali:#7fae4f; --c-fln:#4a78cc;
  }
}

*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--ink)}
h1,h2,h3{margin:0;font-weight:600}
strong{font-weight:600;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}

/* ===== Casca da tela ===== */
.screen{width:100%;max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
.band{height:6px;background:var(--ink);flex:none}
.view{padding:14px 20px calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;flex:1}
.mono{font-family:var(--mono)}
.cond{font-family:var(--cond);font-weight:600;font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.label-sm{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec{padding:16px 0 6px}
.sec.band-l{display:flex;align-items:center;gap:10px}
.sec.band-l i{display:inline-block;width:18px;height:6px;background:var(--ink)}
.body{font-size:13px;color:var(--muted);line-height:1.4}
.title{font-family:var(--cond);font-weight:600;font-size:44px;line-height:.9;text-transform:uppercase}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.hd .note{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.4}
.empty{border-top:1px dashed var(--ink);border-bottom:1px dashed var(--ink);padding:14px 0;color:var(--muted);font-size:14px}

/* ===== IndexTabs ===== */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--ink);padding:0 8px calc(18px + env(safe-area-inset-bottom));background:var(--paper);font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.tabs a{display:flex;align-items:center;justify-content:center;min-height:48px;text-decoration:none;color:var(--muted)}
.tabs a.on{color:var(--ink);border-top:3px solid var(--city);margin-top:-1px}

/* ===== TrustMark ===== */
.tm{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:500;flex:none;color:var(--ink)}
.tm.v{background:var(--ink);color:var(--paper)}
.tm.c{border:1px solid var(--ink)}
.tm.s{border:1px dashed var(--ink)}
.tm.sm{width:14px;height:14px;font-size:9px}
.tmw{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ===== DietMark ===== */
.dm{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:6px 8px;flex:none;line-height:1}
.dm.veg{background:var(--ink);color:var(--paper)}
.dm.mar{border:1px solid var(--ink);color:var(--ink);padding:5px 8px}

/* ===== ExtLink ===== */
.ext{display:inline-flex;align-items:center;justify-content:space-between;gap:6px;height:44px;padding:0 12px;border:1px solid var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink);white-space:nowrap;background:var(--paper)}
.ext.pri{background:var(--ink);color:var(--paper)}
.ext.city{background:var(--city);color:var(--paper);border-color:var(--city)}
.ext.wide{display:flex;height:48px;padding:0 14px;font-size:12px}

/* ===== HazardAlert ===== */
.hz{border-top:3px double var(--ink);padding-top:10px;display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:14px;line-height:1.4}
.hz b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;font-weight:500;color:var(--ink)}
.hz.cp{display:block;padding-top:8px;font-size:13px}
.hz.cp b{margin-right:6px}
.hzs{display:flex;flex-direction:column;gap:12px;padding:16px 0 0}

/* ===== DayHeader ===== */
.dh-top{display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.dh{display:grid;grid-template-columns:44px 1fr 44px;align-items:stretch;border-bottom:1px solid var(--ink)}
.dh a{display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:var(--cond);font-size:28px;min-height:44px;color:var(--ink)}
.dh a.prev{border-right:1px solid var(--ink)}
.dh a.next{border-left:1px solid var(--ink)}
.dh a[aria-disabled="true"]{color:var(--rule);pointer-events:none}
.dh .c{padding:12px 14px 10px;min-width:0;background:var(--city);color:var(--paper);height:118px;display:flex;flex-direction:column;justify-content:space-between}
.dh .c .label{font-size:12px;line-height:1.3;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--paper);opacity:.85}
.dh h2{margin:0;font-family:var(--cond);font-weight:600;font-size:56px;line-height:.9;text-transform:uppercase;letter-spacing:-.01em;color:var(--paper);height:52px;display:flex;align-items:flex-end;white-space:nowrap;overflow:hidden}
.dh h2.long{font-size:44px}
.dh h2.xlong{font-size:36px}
.noite{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.noite .r{text-align:right}
.noite .tag{font-family:var(--mono);font-size:11px;letter-spacing:.04em}

/* ===== FixedBoard ===== */
.fb{display:grid;grid-template-columns:132px 1fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.fb .h{background:var(--city);color:var(--paper);font-family:var(--cond);font-weight:600;font-size:50px;line-height:.9;padding:14px 8px 12px;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.fb .h.sm{font-size:36px}
.fb .t{padding:12px 14px;border-bottom:1px solid var(--ink)}
.fb .t:last-child{border-bottom:0}
.fb .t .n{font-size:18px;font-weight:600;line-height:1.15}
.fb .t .b{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.fb .t .l{font-family:var(--mono);font-size:11px;margin-top:6px;letter-spacing:.06em;display:flex;align-items:center;gap:6px}

/* ===== TearLine ===== */
.tear{display:flex;align-items:center;margin:22px -21px 0;height:20px}
.tear i{width:20px;height:20px;border-radius:50%;background:var(--desk);border:1px solid var(--ink);flex:none}
.tear i:first-child{margin-left:-10px}
.tear i:last-child{margin-right:-10px}
.tear span{flex:1;border-top:2px dashed var(--city)}
:root[data-theme="dark"] .tear i{border-color:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tear i{border-color:transparent}}

/* ===== TimelineRow compacta (Hoje) ===== */
.tl{display:grid;grid-template-columns:64px 1fr;border-top:1px solid var(--ink)}
.tl .h{font-family:var(--cond);font-weight:500;font-size:24px;line-height:1;padding:10px 0;color:var(--muted);border-right:1px solid var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:center}
.tl .h.p{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.tl .t{padding:11px 12px;font-size:15px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tl .t:last-child{border-bottom:1px solid var(--ink)}
.tl .f .h,.tl .h.f{color:var(--city);font-weight:600}
.tl .t.f{font-weight:600}
.tl .t .sg{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;flex:none}

/* ===== TimelineRow expandida (Dia completo) ===== */
.tx{display:grid;grid-template-columns:64px 1fr;margin-bottom:24px}
.tx .h{font-family:var(--cond);font-weight:500;font-size:26px;line-height:1;padding:14px 0 0;color:var(--muted);border-right:1px solid var(--ink);font-variant-numeric:tabular-nums}
.tx .h.p{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding-top:18px}
.tx .h.f{background:var(--city);color:var(--paper);font-weight:600;padding:14px 4px 0;border-right:0}
.tx .c{padding:14px 12px 12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:5px}
.tx .c.f{border-bottom:1px solid var(--ink)}
.tx .c.last{border-bottom:1px solid var(--ink)}
.tx .c .ti{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tx .c .ti span:first-child{font-size:16px;font-weight:600;line-height:1.25}
.tx .c.f .ti span:first-child{font-size:17px}
.tx .c .fx{font-family:var(--mono);font-size:10px;letter-spacing:.08em;font-weight:500;color:var(--city)}
.tx .c .b{font-size:13px;color:var(--muted);line-height:1.4}
.tx .g{border-right:1px solid var(--ink)}
.tx .g.f{background:var(--city);border-right:0}
.tx .mv{padding:6px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--rule);text-transform:uppercase}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--rule)}
.dc-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.dc-hd a{text-decoration:none;color:var(--ink);min-height:44px;display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.dc-hd .r{text-align:right}

/* ===== ReservationStub ===== */
.rs{display:grid;grid-template-columns:70px 1fr;border-bottom:1px solid var(--ink)}
.rs.first{border-top:1px solid var(--ink)}
.rs .l{padding:12px 0;border-right:1px solid var(--ink)}
.rs .l .d{font-family:var(--cond);font-weight:600;font-size:30px;line-height:.9;color:var(--city)}
.rs .l .d small{font-weight:500;color:var(--muted);font-size:30px}
.rs .l .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.rs .l .h{font-family:var(--cond);font-weight:600;font-size:26px;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums;color:var(--city)}
.rs .r{padding:12px 0 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rs .r .ti{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rs .r .ti span:first-child{font-size:16px;font-weight:600;line-height:1.2}
.rs .r .b{font-size:13px;color:var(--muted);line-height:1.4}
.rs .r .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.rs .r .loc{font-family:var(--mono);font-size:16px;letter-spacing:.1em;overflow-wrap:anywhere}
.rs.pend{border-bottom:1px dashed var(--ink);color:var(--muted)}
.rs.pend.first{border-top:1px dashed var(--ink)}
.rs.pend .l{border-right:1px dashed var(--ink)}
.rs.pend .l .d,.rs.pend .r .ti span:first-child{color:var(--muted)}
.rs.pend .r .b{color:var(--muted)}
.pt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;flex:none;color:var(--muted)}

/* ===== CityFilter + RestaurantRow ===== */
.cf{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.cf button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:48px;border-left:1px solid var(--rule);color:var(--ink)}
.cf button:first-child{border-left:0}
.cf button i{width:18px;height:4px;display:block}
.cf button.on{background:var(--city);color:var(--paper)}
.rr{border-top:1px solid var(--ink);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.rr:last-child{border-bottom:1px solid var(--ink)}
.rr .hd2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rr .nm{font-size:18px;font-weight:600;line-height:1.15}
.rr .b{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
.rr .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;line-height:1.4;border-top:1px solid var(--rule);padding-top:8px}
.rr .g2 .mono{font-size:10px}
.rr .ac{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rr .ac .ext{display:flex}
.rr.pend{border-top:1px dashed var(--ink);color:var(--muted)}
.rr.pend:last-child{border-bottom:1px dashed var(--ink)}
.rr.pend .nm{color:var(--muted)}

/* ===== PracticalBlocks ===== */
.em{display:grid;grid-template-columns:110px 1fr;border-bottom:1px solid var(--ink)}
.em .l{background:var(--ink);color:var(--paper);padding:12px 10px}
.em .l .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.em .l .n{font-family:var(--cond);font-weight:600;font-size:56px;line-height:.9;margin-top:2px}
.em .r{padding:12px 14px;font-size:14px;line-height:1.45;display:flex;align-items:center}
.list{display:flex;flex-direction:column;border-top:1px solid var(--ink);font-size:15px;line-height:1.4}
.list .row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);min-height:44px;align-items:center}
.list .row:last-child{border-bottom:1px solid var(--ink)}
.list .row a.tel{font-family:var(--mono);font-size:14px;text-decoration:none;white-space:nowrap}
.list .row .r{color:var(--muted);text-align:right;font-size:14px}
.list .row .k{font-weight:600;font-size:14px}
.hs{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start;font-size:14px;line-height:1.4}
.hs:last-child{border-bottom:1px solid var(--ink)}
.hs i{height:6px;margin-top:7px;display:block}
.hs.pend{color:var(--muted)}
.hs.pend i{border:1px dashed var(--muted);height:6px}
.hs .a{color:var(--muted)}
.g2b{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font-size:13px;line-height:1.4}
.g2b>div{padding:10px 10px 10px 0}
.g2b>div+div{padding:10px 0 10px 12px;border-left:1px solid var(--ink)}
.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.g3b>div{padding:10px 8px}
.g3b>div:first-child{padding-left:0}
.g3b>div:last-child{padding-right:0}
.g3b>div+div{border-left:1px solid var(--ink)}
.bign{font-family:var(--cond);font-weight:600;font-size:30px;line-height:1;margin:4px 0}
.bign small{color:var(--muted);font-weight:500;font-size:30px}
.g3b .bign{font-size:34px;margin:4px 0 0}
.g3b .s{font-size:11px;color:var(--muted)}
.theme{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.theme .ext{height:40px}

/* ===== Mapa ===== */
#map svg{display:block;width:100%;height:auto}
.legs{display:grid;grid-template-columns:34px 1fr;border-top:1px solid var(--ink);margin-bottom:24px}
.legs .n{font-family:var(--cond);font-weight:600;font-size:22px;line-height:1;padding:10px 0;border-right:1px solid var(--ink)}
.legs .t{padding:10px 12px;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.35;display:flex;justify-content:space-between;gap:8px}
.legs .t:last-child{border-bottom:1px solid var(--ink)}
.legs .t span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.legs .band-i{display:inline-block;width:18px;height:6px;vertical-align:middle;margin-right:8px}

.foot{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.6;padding:8px 0 24px}

/* ===== Tela de chave (só na versão instalável) ===== */
#trava{position:fixed;inset:0;z-index:50;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#trava[hidden]{display:none}
#trava .faixa{display:flex;width:168px;height:8px}
#trava .faixa i{flex:1}
#trava h1{font-family:var(--display,inherit);font-weight:600;font-size:44px;line-height:1;margin:6px 0 0;letter-spacing:.01em}
#trava p{margin:0;color:var(--muted);font-size:14px;max-width:280px}
#trava input{font-family:var(--mono,monospace);font-size:18px;letter-spacing:.08em;text-align:center;text-transform:uppercase;width:min(300px,86vw);padding:13px 10px;border:1.5px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);outline:none}
#trava button{font-family:var(--mono,monospace);font-size:13px;letter-spacing:.12em;text-transform:uppercase;width:min(300px,86vw);padding:14px;border:0;background:var(--ink);color:var(--paper);cursor:pointer}
#trava button[disabled]{opacity:.5}
#trava .erro{color:#a31f2e;min-height:20px;font-size:13px}
</style>
</head>
<body>
<div id="trava" hidden>
  <div class="faixa"><i style="background:#1f4fa3"></i><i style="background:#c0541b"></i><i style="background:#0f7c7c"></i><i style="background:#a31f2e"></i><i style="background:#44732a"></i><i style="background:#d26d12"></i><i style="background:#5b3fa0"></i></div>
  <h1>PT·ES 2026</h1>

<script>
(function(){
'use strict';
var C=JSON.parse(document.getElementById('cofre').textContent);
var GUARDA='guia-chave';
var trava=document.getElementById('trava'), campo=document.getElementById('trava-chave'), erro=document.getElementById('trava-erro'), ok=document.getElementById('trava-ok');
function de64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function para64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function derivar(frase){
  var limpa=frase.toUpperCase().replace(/[^A-Z0-9]/g,'');
  return crypto.subtle.importKey('raw',new TextEncoder().encode(limpa),'PBKDF2',false,['deriveBits'])
    .then(function(m){return crypto.subtle.deriveBits({name:'PBKDF2',salt:de64(C.sal),iterations:C.it,hash:'SHA-256'},m,256);})
    .then(function(b){return new Uint8Array(b);});
}
function abrir(chave){
  return crypto.subtle.importKey('raw',chave,'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:de64(C.iv)},k,de64(C.ct));})
    .then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}
function iniciar(p){
  document.getElementById('dados').textContent=p.dados;
  trava.hidden=true;
  var s=document.createElement('script'); s.textContent=p.app; document.body.appendChild(s);
}
function pedir(){ trava.hidden=false; try{campo.focus();}catch(e){} }
document.getElementById('trava-form').addEventListener('submit',function(e){
  e.preventDefault(); erro.textContent=''; ok.disabled=true; ok.textContent='Abrindo…';
  derivar(campo.value).then(function(ch){
    return abrir(ch).then(function(p){ try{localStorage.setItem(GUARDA,para64(ch));}catch(e){} iniciar(p); });
  }).catch(function(){ erro.textContent='Chave incorreta. Confira e tente de novo.'; ok.disabled=false; ok.textContent='Abrir'; });
});
var guardada=null; try{guardada=localStorage.getItem(GUARDA);}catch(e){}
if(guardada){ abrir(de64(guardada)).then(iniciar).catch(function(){ try{localStorage.removeItem(GUARDA);}catch(e){} pedir(); }); }
else pedir();
// Aplicativo offline: registra já, mesmo com a tela de chave aberta.
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  var reg=function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); };
  if(document.readyState==='complete') reg(); else window.addEventListener('load',reg);
}
})();
</script>
